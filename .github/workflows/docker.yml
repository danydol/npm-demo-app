name: Run Docker on Self-Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-app .

      - name: Run Docker Container
        run: |
          docker run -d -p 8080:80 my-app
          
      - name: Verify Container
        run: |
          docker ps
