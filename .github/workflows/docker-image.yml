name: Docker Image CICD_Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository  # ✅ Fetches your repository
      uses: actions/checkout@v4
    
    - name: Get Docker Image Tag
      run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            TAG=latest
          else
            TAG=${GITHUB_SHA::7}
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
    - name: Install SonarScanner
      run: |
          curl -o sonar-scanner-cli.zip -L https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner-cli.zip
          echo "$(pwd)/sonar-scanner-5.0.1.3006-linux/bin" >> $GITHUB_PATH     
    - name: Run SonarQube Scan
      run: |
          sonar-scanner \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=your-project-key \
            -Dsonar.sources=.
      
    - name: Debug Repository Structure
      run: |
          pwd
          ls -la  # Check if Dockerfile exists
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD1 }}
          context: .


    - name: Build Docker Image
      run: |
          docker build -t dando1/node:$TAG .
          
      
    - name: Push Docker Image
      run: |
          docker push  dando1/node:$TAG
