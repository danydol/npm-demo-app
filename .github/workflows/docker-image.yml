name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository  # ✅ Fetches your repository
      uses: actions/checkout@v4
    
    - name: Get Docker Image Tag
      run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            TAG=latest
          else
            TAG=${GITHUB_SHA::7}
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV    
      
     
      
    - name: Debug Repository Structure
      run: |
          pwd
          ls -la  # Check if Dockerfile exists
    - name: Allow Insecure Nexus Registry
      run: |
          sudo mkdir -p /etc/docker
          echo '{ "insecure-registries":["109.186.150.144:8083"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker      
    - name: Log in to nexus
      uses: docker/login-action@v3
      with:
          registry: 109.186.150.144:8083
          username: ${{ secrets.DOCKER_USERNAME_NEXUS }}
          password: ${{ secrets.DOCKER_PASSWORD_NEXUS }}
          context: .


    - name: Build Docker Image
      run: |
          docker build -t 109.186.150.144:8083/node:$TAG .
          
      
    - name: Push Docker Image
      run: |
          docker push  109.186.150.144:8083/node:$TAG
