name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
          username: dando1
          password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
          username: $user
          password: $password

    - name: Build Docker Image
      run: |
          docker build -t tag dando1/node:100
      
    - name: Push Docker Image
      run: |
          docker push tag dando1/node:100
